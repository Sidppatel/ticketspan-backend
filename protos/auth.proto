syntax = "proto3";

package ticketspan.auth;

option csharp_namespace = "TicketSpan.Protos.Auth";

import "common.proto";

service AuthService {
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc SignUp (SignUpRequest) returns (AuthResponse);
  rpc GoogleSignIn (GoogleSignInRequest) returns (AuthResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (AuthResponse);
  rpc Logout (LogoutRequest) returns (ticketspan.common.AckResponse);
  rpc RequestMagicLink (MagicLinkRequest) returns (ticketspan.common.AckResponse);
  rpc VerifyMagicLink (MagicLinkVerifyRequest) returns (AuthResponse);
  rpc RequestPasswordReset (PasswordResetRequest) returns (ticketspan.common.AckResponse);

  rpc ValidatePasswordResetToken (ValidateResetTokenRequest) returns (ticketspan.common.AckResponse);
  rpc SetPassword (SetPasswordRequest) returns (ticketspan.common.AckResponse);
  rpc Me (ticketspan.common.Empty) returns (UserProfile);
  rpc UpdateProfile (UpdateProfileRequest) returns (UserProfile);
  rpc SetAvatar (SetAvatarRequest) returns (UserProfile);
  rpc LinkGoogle (LinkGoogleRequest) returns (UserProfile);
  rpc UnlinkGoogle (ticketspan.common.Empty) returns (UserProfile);
}

message LinkGoogleRequest {
  string google_token = 1;
}

message UpdateProfileRequest {
  string first_name = 1;
  string last_name = 2;
  string phone = 3;
  string address_line = 4;
  string city = 5;
  string state = 6;
  string zip = 7;
  string bio = 8;
  string pronouns = 9;
  string preferences_json = 10;
  string billing_address_line = 11;
  string billing_city = 12;
  string billing_state = 13;
  string billing_zip = 14;
}

message SetAvatarRequest {
  string images_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string tenant_slug = 3;

  string portal = 4;
}

message SignUpRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string tenant_slug = 5;
}

message GoogleSignInRequest {
  string google_token = 1;
  string tenant_slug = 2;

  string portal = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string session_hash = 1;
}

message MagicLinkRequest {
  string email = 1;
  string tenant_slug = 2;
  string origin = 3;
}

message MagicLinkVerifyRequest {
  string token = 1;
}

message PasswordResetRequest {
  string email = 1;
  string tenant_slug = 2;

  string origin = 3;
}

message ValidateResetTokenRequest {
  string token = 1;
}

message SetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
  UserProfile user = 4;
}

message UserProfile {
  string users_id = 1;
  string tenants_id = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  int32 role = 6;
  string tenant_slug = 7;
  bool email_verified = 8;
  string avatar_url = 9;
  string phone = 10;
  string address_line = 11;
  string city = 12;
  string state = 13;
  string zip = 14;
  bool google_connected = 15;
  string bio = 16;
  string pronouns = 17;
  string preferences_json = 18;
  string billing_address_line = 19;
  string billing_city = 20;
  string billing_state = 21;
  string billing_zip = 22;
}
