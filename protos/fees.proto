syntax = "proto3";

package ticketspan.fees;

option csharp_namespace = "TicketSpan.Protos.Fees";

import "common.proto";

service FeeService {

  rpc ListFeeFormulas (ticketspan.common.Empty) returns (ListFeeFormulasResponse);

  rpc CreateFeeFormula (FeeFormulaInput) returns (ticketspan.common.UuidValue);
  rpc UpdateFeeFormula (FeeFormula) returns (ticketspan.common.AckResponse);
  rpc DeleteFeeFormula (ticketspan.common.UuidValue) returns (ticketspan.common.AckResponse);

  rpc ListAllEvents (ticketspan.common.Empty) returns (DeveloperEventsResponse);

  rpc AssignFeeFormula (AssignFeeFormulaRequest) returns (ticketspan.common.AckResponse);
}

message FeeFormula {
  reserved 5;
  reserved "min_fee_cents";
  string fee_formulas_id = 1;
  string name = 2;
  int32 percent_bps = 3;
  int32 flat_cents = 4;
  int32 max_fee_cents = 6;
  bool is_active = 7;
}

message FeeFormulaInput {
  reserved 4;
  reserved "min_fee_cents";
  string name = 1;
  int32 percent_bps = 2;
  int32 flat_cents = 3;
  int32 max_fee_cents = 5;
}

message ListFeeFormulasResponse {
  repeated FeeFormula formulas = 1;
}

message FeeLineItem {
  string id = 1;
  string kind = 2;
  string label = 3;
  int32 price_cents = 4;
  string fee_formulas_id = 5;
  int32 fee_cents = 6;
}

message DeveloperEvent {
  string events_id = 1;
  string tenants_id = 2;
  string tenant_name = 3;
  string title = 4;
  string status = 5;
  repeated FeeLineItem items = 6;
}

message DeveloperEventsResponse {
  repeated DeveloperEvent events = 1;
}

message AssignFeeFormulaRequest {
  string kind = 1;
  string target_id = 2;
  string fee_formulas_id = 3;
  string reason = 4;
}
